name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint --workspace=apps/web
      - run: npm run build:web
      - run: npm run build --workspace=infra/cdk
      - run: npm test --workspace=infra/cdk
      - run: npm run cdk --workspace=infra/cdk -- synth
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Hits the real deployed /arrange API (no local Lambda emulation — see
      # CLAUDE.md); traffic is near-zero and the API's own throttle (5 req/s)
      # bounds the blast radius. Revisit if that stops being true.
      - run: npx playwright test
        working-directory: apps/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build:web
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::147560746374:role/driftscore-github-actions-deploy
          aws-region: ap-northeast-1
          role-skip-session-tagging: true
      - run: npm run cdk --workspace=infra/cdk -- deploy --require-approval never
