name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build:web
      - run: npm run build --workspace=infra/cdk
      - run: npm test --workspace=infra/cdk
      - run: npm run cdk --workspace=infra/cdk -- synth

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build:web
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::147560746374:role/driftscore-github-actions-deploy
          aws-region: ap-northeast-1
          role-skip-session-tagging: true
      - run: npm run cdk --workspace=infra/cdk -- deploy --require-approval never
